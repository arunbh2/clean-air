# Build the Clean Air site from /research and publish it to GitHub Pages.
# Pull requests: build and validate only. Pushes to main: build and deploy.
name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:                 # rebuild after a scheduled signals refresh has committed to main
    workflows: ["Refresh signals"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # after a signals refresh, build only if the refresh succeeded (a failed refresh leaves the published site as it was)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}   # pick up the refresh commit
          fetch-depth: 0   # build date comes from the last commit touching research/ or site/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -r site/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser QA dependencies
        working-directory: site/qa
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      # One command: registers, build, voice, design, links, agent files, format comparison,
      # CSV safety, propagation, every checker's failing fixture, and the Playwright + axe browser suite.
      # Nothing is uploaded or deployed unless every check passes.
      - name: Validate and build (tools/check_all.py)
        run: python tools/check_all.py --browser
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

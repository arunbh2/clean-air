# Latest Signals: source registry (docs/live-signals-master-brief.md, section 3).
# One entry per external source. The ingestion job (tools/signals/ingest.py) reads only entries with enabled: true.
# Never add an endpoint that has not been tested: record the test date, HTTP status and what came back.
# Fields:
#   id                 stable source ID (never reuse)
#   name, publisher    as the source names itself
#   org_type           government | ngo | foundation | development_bank | research | company | newsroom | multilateral
#   atlas_org_id       organisation ID in research/data/organisations.csv when the publisher is in the atlas (exact match only)
#   provenance_kind    official | peer_reviewed_metadata | preprint | publisher_report | NGO_self_report | company_self_report | independent_reporting
#   default_type       news | research | preprint | report | policy | funding | project | other (rules in taxonomy.yml may refine it)
#   access             rss | atom | api_europepmc | api_crossref | api_openalex | manual
#   endpoint           the exact URL tested; {from_date} is filled by the job
#   rights             metadata_only: title, date, publisher, link and tags only. No article text, abstract, image or description is stored.
#   scope              geographic scope of the source: regional (the source itself is about South or Southeast Asia) or global (needs a place match)
#   requires           what an item needs to be included: pollution (an air-pollution term) and place (a country, city or regional term)
#   test               last manual connector test: date, HTTP status and result
#   enabled            false = documented candidate, not fetched
user_agent: "CleanAirSignals/1.0 (+https://arunbh2.github.io/clean-air/signals/how-it-works.html)"
defaults:
  timeout_seconds: 25
  max_bytes: 3000000
  retries: 2
  window_days: 365          # research APIs: publication dates in the last 12 months
  archive_days: 400         # records older than this (by publication date) are not added; existing records are kept
sources:
  # ---------- A. Scientific research and bibliographic metadata ----------
  - id: europepmc
    name: Europe PMC REST search
    publisher: Europe PMC (EMBL-EBI)
    org_type: research
    provenance_kind: peer_reviewed_metadata
    default_type: research
    access: api_europepmc
    endpoint: "https://www.ebi.ac.uk/europepmc/webservices/rest/search"
    query: '("air pollution" OR "air quality" OR "PM2.5" OR "particulate matter" OR "black carbon" OR "crop residue burning" OR "brick kiln" OR "household air pollution") AND (India OR Delhi OR Bangladesh OR Dhaka OR Nepal OR Kathmandu OR Pakistan OR Lahore OR Bhutan OR "Sri Lanka" OR Indonesia OR Thailand OR Vietnam OR "Viet Nam" OR Philippines OR Cambodia OR Laos OR Malaysia OR Singapore OR Myanmar OR "South Asia" OR "Southeast Asia" OR "Indo-Gangetic")'
    page_size: 100
    max_pages: 3
    homepage: "https://europepmc.org/RestfulWebService"
    cadence: daily index updates
    licence_notes: "Metadata from the Europe PMC REST API. Abstracts are not stored. Preprints are labelled as preprints (Europe PMC source PPR)."
    rights: metadata_only
    scope: global
    requires: [pollution, place]
    pollution_in_title: true
    language: en
    test: {date: "2026-11-23", status: 200, result: "92 hits for four South Asian countries, 1-23 Nov 2026; JSON with firstPublicationDate, doi, pubTypeList, journal title"}
    enabled: true
  - id: crossref
    name: Crossref REST API (works)
    publisher: Crossref
    org_type: research
    provenance_kind: peer_reviewed_metadata
    default_type: research
    access: api_crossref
    endpoint: "https://api.crossref.org/works"
    query: "air pollution PM2.5 India Bangladesh Nepal Pakistan Indonesia Thailand Vietnam Philippines"
    rows: 100
    homepage: "https://www.crossref.org/documentation/retrieve-metadata/rest-api/"
    cadence: continuous deposits
    licence_notes: "Bibliographic metadata, which Crossref describes as facts free to reuse. Not full text and not verification. Polite pool: identifying User-Agent."
    rights: metadata_only
    scope: global
    requires: [pollution, place]
    pollution_in_title: true
    language: en
    test: {date: "2026-11-23", status: 200, result: "work-list JSON; relevance search is broad, so the title filter does most of the work; some issue dates are in 2027 (handled as future-dated)"}
    enabled: true
  - id: openalex
    name: OpenAlex works API
    publisher: OurResearch (OpenAlex)
    org_type: research
    provenance_kind: peer_reviewed_metadata
    default_type: research
    access: api_openalex
    endpoint: "https://api.openalex.org/works"
    query: "air pollution PM2.5 South Asia Southeast Asia"
    homepage: "https://docs.openalex.org/"
    cadence: daily
    licence_notes: "Responses on 2026-11-23 carried usage-credit headers (x-ratelimit-limit-usd, x-ratelimit-cost-usd), so access is metered. Enabled only when the OPENALEX_API_KEY repository secret exists; the key is never committed or sent to the browser."
    rights: metadata_only
    scope: global
    requires: [pollution, place]
    pollution_in_title: true
    language: en
    secret: OPENALEX_API_KEY
    test: {date: "2026-11-23", status: 200, result: "works JSON without a key, with metered credit headers; quota and pricing to be confirmed by the owner"}
    enabled: false
    status_note: "Disabled pending owner decision on an API key and budget (docs/LIVE_SIGNALS_AUDIT.md, decision 2)."

